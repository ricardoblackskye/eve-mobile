name: E2E

# E2E is the slow gate (it builds an iOS-simulator app, then runs Maestro).
# It is intentionally NOT part of the per-PR CI: it runs after a merge to main
# (post-merge re-verification) and can be triggered manually from the Actions tab
# (workflow_dispatch), so pull requests stay fast.
#
# We build + install with xcodebuild/simctl instead of `expo run:ios`:
# `expo run:ios` launches the app as an Expo dev client and opens the
# expo-development-client:// Metro deep link, which times out on CI
# (xcrun simctl openurl, NSPOSIXErrorDomain code 60) and hangs. A Release build
# bundles the JS, so no Metro/dev-client URL is needed and Maestro can launch the
# installed app directly.
#
# Speed: a cold RN iOS Release build is 15-40 min, so we cache the CocoaPods specs
# and the Xcode DerivedData (ios/build) keyed on the dependency set — repeat runs
# land in minutes. CODE_SIGNING_ALLOWED=NO keeps the simulator build from needing a
# cert/profile the runner lacks (Debug signed fine, Release otherwise may not).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E (Maestro, iOS simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache CocoaPods specs
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ios/build
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-
      - run: npm ci
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Generate native project
        run: npx expo prebuild --platform ios
      - name: Build iOS app (Release, JS bundled) for simulator
        run: >-
          xcodebuild -workspace ios/evemobile.xcworkspace -scheme evemobile
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build build
          CODE_SIGNING_ALLOWED=NO
      - name: Boot simulator and install app
        run: |
          SIM_UDID=$(xcrun simctl list devices available | grep -iE 'iphone' | grep -oE '[0-9A-Fa-f-]{36}' | head -1)
          echo "Using simulator $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl install "$SIM_UDID" ios/build/Build/Products/Release-iphonesimulator/evemobile.app
      - name: Run Maestro flows
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test maestro/flows
