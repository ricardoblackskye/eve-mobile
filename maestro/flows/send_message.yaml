# Sends a message and asserts the composer placeholder reappears, proving the
# input cleared on send (pure UI state). This is backend-independent — no Eve API
# is required, so the flow passes in CI without credentials.
appId: com.ricardoblackskye.evemobile
---
- launchApp
- tapOn:
    id: "chat-input"
- inputText: "Hello Eve"
- tapOn:
    id: "chat-send"
- assertVisible: "Type your message…"
